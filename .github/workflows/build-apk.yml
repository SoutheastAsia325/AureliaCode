# build-apk.yml — 云端从源重建 AureliaCode APK（自包含，宿主=本 APK 仓库）
#
# 本项目 = AureliaCode（派生自 kelai141/dsh-mobile-apk）。产物落在 out/aureliacode/，
# 命名 aureliacode-v<versionName>-<abi>.apk，其中版本号由 scripts/build-apk.mjs
# 从 app/build.gradle.kts 读取（单一来源，避免产物名与实际版本漂移）。
#
# 目标：源码更新后云端能「从源重建快照 + 打包 APK」，不依赖协调库。
# 整套构建链（build-snapshot/inject/门禁脚本、@dsh-android 插件、插架子仓库、vendor、底座、LICENSES）
# 均随本仓库提交；本 workflow 只操作本仓库（GITHUB_REPOSITORY = dsh-mobile-apk）。
#
# 流程：检出自仓库(node/python/java) -> npm 构建 6 个缺 lib/ 的插件 -> stage 底座 base/
#       -> node scripts/build-snapshot-013.mjs <abi>（Termux 源装配 + 注入 + 门禁 + 归档）
#       -> node scripts/build-apk.mjs <abi>（注入插件 + 门禁 + gradle + 产物）
#       -> upload-artifact（不出 Release）。
# 注：build-snapshot（Termux 包下载 + 归档压缩）+ 插件 npm 构建较重，需一次 dry-run 迭代验证。

name: build-apk

on:
  workflow_dispatch:
    inputs:
      abi:
        description: '目标 ABI（可多选）'
        type: choice
        options: [arm64, x86_64, 'both']
        default: 'both'
      suffix:
        description: 'APK 版本后缀（默认空=正式版纯净版本号；测试构建显式传 -fix 等）'
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64, x86_64]
      fail-fast: false
    env:
      # build-apk.mjs 依赖本仓库顶层 scripts/plugins/vendor/base；apk 仓库 = $GITHUB_WORKSPACE
      DSH_APK_DIR: ${{ github.workspace }}
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # lfs: false 是**刻意**的：本仓库派生自另一仓库，普通 git push 不会
          # 转移 Git LFS 对象，本仓库的 LFS 存储是空的 —— 开启 lfs: true 会在
          # "Fetching LFS objects" 直接失败（首次云端构建即栽在这里，两个 ABI
          # 的 job 都在检出步骤 red）。底座改由下一步从上游按 sha256 校验取回。
          lfs: false

      - name: 实体化底座归档（从上游 LFS 取回并按 sha256 校验）
        shell: bash
        run: bash scripts/materialize-base-lfs.sh base

      - name: 准备运行时（node；dsh-client-ui-responsive 的 tsdown 要求 node ^22.18 || >=24.11）
        uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: python -> python3（脚本用 `python`）
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3 python-is-python3 || sudo ln -sf /usr/bin/python3 /usr/bin/python
          python --version
      - name: 准备 Java（gradle 需要）
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: 构建插件（6 个含 build 脚本的；dsh-host-web-compat 用已提交 lib）
        shell: bash
        run: |
          set -e
          for d in plugins/dsh-android-bridge plugins/dsh-android-manage plugins/dsh-android-linux-env plugins/dsh-android-file-open plugins/dsh-model-capability dsh-shell-termux dsh-client-ui-responsive; do
            echo "== npm build $d =="
            (cd "$d" && npm install --no-audit --no-fund && npm run build)
          done

      - name: stage 底座归档（base/ -> .deploy-tmp/<base-dir>/）
        shell: bash
        run: |
          set -e
          abi="${{ matrix.abi }}"
          # build-snapshot-013.mjs 的 BASE_DIR：arm64 -> arm64-base；x86_64 -> x64-base（缩写，勿写 x86_64-base）
          if [ "$abi" = "arm64" ]; then bdir="arm64-base"; else bdir="x64-base"; fi
          mkdir -p ".deploy-tmp/${bdir}"
          [ -f "base/base-usr-${abi}.tar.xz" ] || { echo "缺 base/base-usr-${abi}.tar.xz"; exit 1; }
          cp "base/base-usr-${abi}.tar.xz" ".deploy-tmp/${bdir}/base-usr.tar.xz"
          [ -f "base/base-dsh.tar.xz" ] && cp "base/base-dsh.tar.xz" ".deploy-tmp/${bdir}/base-dsh.tar.xz"
          du -sh ".deploy-tmp/${bdir}"

      - name: 构建快照 ${abi}（build-snapshot，Termux 源装配 + 注入 + 门禁 + 归档）
        shell: bash
        run: |
          set -e
          node scripts/build-snapshot-013.mjs "${{ matrix.abi }}"

      - name: 构建 APK ${abi}（注入插件 + 门禁 + gradle + 产物）
        shell: bash
        run: |
          set -e
          node scripts/build-apk.mjs --abi "${{ matrix.abi }}" --suffix "${{ github.event.inputs.suffix }}"

      - name: 校验 APK 图标资源链（aapt2 权威 dump）
        shell: bash
        run: |
          set -e
          APK=$(ls out/aureliacode/*.apk | head -1)
          echo "APK: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          AAPT="$BT/aapt2"
          if [ ! -x "$AAPT" ]; then echo "aapt2 不可用，跳过"; exit 0; fi
          "$AAPT" version
          echo "--- 图标相关资源条目 ---"
          "$AAPT" dump resources "$APK" 2>/dev/null | grep -E "^ *resource .*(ic_launcher|aureliacode_icon)" -A 3 || true
          echo "--- 自适应图标前景引用解析 ---"
          "$AAPT" dump xmltree "$APK" --file res/mipmap-anydpi-v26/ic_launcher.xml 2>/dev/null || true
          "$AAPT" dump xmltree "$APK" --file res/mipmap-anydpi-v33/ic_launcher.xml 2>/dev/null || true
          echo "--- drawable 尺寸（确认新图 512x512）---"
          "$AAPT" dump badging "$APK" 2>/dev/null | grep -E "application-icon|application:" || true

      - name: 上传 APK 产物（本地下载 debug；不出 Release）
        uses: actions/upload-artifact@v4
        with:
          name: aureliacode-${{ matrix.abi }}${{ github.event.inputs.suffix }}
          path: out/aureliacode/*.apk
          if-no-files-found: error
          retention-days: 30
