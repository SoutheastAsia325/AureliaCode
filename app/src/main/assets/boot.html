<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AureliaCode</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%;
    background: #0D0D0D; color: #E8E8E8;
    font-family: -apple-system, "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  }
  .wrap {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px; padding: 32px;
    text-align: center; box-sizing: border-box;
  }
  .name { font-size: 22px; font-weight: 600; letter-spacing: .3px; }
  .sub  { font-size: 13px; color: #8A8A8A; }
  .ring {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid #1F1F1F; border-top-color: #4A9EFF;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint {
    font-size: 12px; color: #6E6E6E; max-width: 30em; line-height: 1.7;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="ring"></div>
    <div class="name">AureliaCode</div>
    <div class="sub">正在启动内嵌引擎…</div>
    <div class="hint">
      首次启动需要解压运行时，通常 1&ndash;3 分钟。<br>
      引擎就绪后本页会自动进入，无需操作。
    </div>
  </div>
</body>
</html>
